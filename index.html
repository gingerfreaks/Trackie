<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trackie</title>
  <link rel="manifest" href="/Trackie/manifest.json" />
  <meta name="theme-color" content="#0a0f1d" />
  <link rel="apple-touch-icon" href="/Trackie/icon-512.png" />

  <!-- Firebase Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --surface: rgba(18, 24, 38, 0.95);
      --surface-card: #111827;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --input-bg: #0f172a;
      --success: #10b981;
      --danger: #ef4444;
      --present: rgba(16, 185, 129, 0.15);
      --absent: rgba(239, 68, 68, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Auth Screen Container */
    #authView {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 0%, #1e1b4b, var(--bg));
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .badge {
      display: inline-block;
      align-self: center;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* Top Nav */
    .app-header {
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .app-header h1 {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .app-main {
      flex: 1;
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Selectors & Badges */
    .class-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .class-chip {
      background: var(--surface-card);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .class-chip.active {
      background: var(--primary);
      color: #041427;
      border-color: var(--primary);
    }

    /* Student List */
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .student-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .student-card.present {
      border-color: rgba(16, 185, 129, 0.4);
      background: var(--present);
    }

    .student-card.absent {
      border-color: rgba(239, 68, 68, 0.4);
      background: var(--absent);
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .roll-pill {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 0.25rem 0.5rem;
      border-radius: 8px;
    }

    .student-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .status-indicator {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      text-transform: uppercase;
    }

    .present .status-indicator {
      background: var(--success);
      color: #041427;
    }

    .absent .status-indicator {
      background: var(--danger);
      color: #fff;
    }

    /* Inputs and Buttons */
    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #041427;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- AUTH VIEW -->
  <div id="authView">
    <div class="auth-card">
      <div style="text-align:center;">
        <span class="badge">Apex Academic Cloud</span>
        <h1 style="font-size:1.8rem; margin-top:0.5rem; font-weight:800;">Trackie</h1>
        <p style="color:var(--muted); font-size:0.85rem; margin-top:0.25rem;">Attendance & Workspace Management</p>
      </div>

      <div id="phoneStep" style="display:flex; flex-direction:column; gap:0.85rem;">
        <div>
          <label style="font-size:0.75rem; color:var(--muted); font-weight:600; text-transform:uppercase;">Mobile Number</label>
          <div style="display:flex; gap:0.5rem; margin-top:0.35rem;">
            <div style="background:var(--input-bg); border:1px solid var(--border); color:var(--muted); border-radius:12px; padding:0.85rem 1rem; font-weight:600;">+91</div>
            <input type="tel" id="phoneNumber" placeholder="9999999999" maxlength="10" inputmode="numeric" />
          </div>
        </div>
        <button id="btnSendOtp" type="button">Send OTP</button>
      </div>

      <div id="otpStep" class="hidden" style="display:flex; flex-direction:column; gap:0.85rem;">
        <div>
          <label style="font-size:0.75rem; color:var(--muted); font-weight:600; text-transform:uppercase;">6-Digit OTP</label>
          <input type="number" id="otpCode" placeholder="123456" maxlength="6" inputmode="numeric" style="margin-top:0.35rem;" />
        </div>
        <button id="btnVerifyOtp" type="button">Verify & Launch</button>
        <button id="btnResetPhone" type="button" class="secondary">Back</button>
      </div>

      <div id="recaptchaContainer"></div>
      <div id="authStatus" style="font-size:0.8rem; text-align:center; min-height:1rem;"></div>
    </div>
  </div>

  <!-- WORKSPACE VIEW -->
  <div id="appView" class="hidden">
    <header class="app-header">
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <h1>Trackie</h1>
        <span class="badge" style="font-size:0.65rem;">FACULTY</span>
      </div>
      <button id="btnSignOut" type="button" class="secondary" style="font-size:0.75rem; padding:0.4rem 0.8rem;">Exit</button>
    </header>

    <main class="app-main">
      <!-- Batch / Class Filter -->
      <div class="class-bar">
        <div class="class-chip active" onclick="switchBatch(this, 'Batch A - CS')">Batch A (CS)</div>
        <div class="class-chip" onclick="switchBatch(this, 'Batch B - IT')">Batch B (IT)</div>
        <div class="class-chip" onclick="switchBatch(this, 'Batch C - AI')">Batch C (AI)</div>
      </div>

      <!-- Quick Actions / Submission Bar -->
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div class="section-title">Active Roll Sheet</div>
          <p id="statsCounter" style="font-size:0.8rem; color:var(--muted); margin-top:0.15rem;">Present: 4 | Absent: 0</p>
        </div>
        <button id="btnSaveAttendance" type="button" style="font-size:0.85rem; padding:0.5rem 1rem;">Save Session</button>
      </div>

      <!-- Tap-to-toggle Attendance List -->
      <div id="studentList" style="display:flex; flex-direction:column; gap:0.6rem;"></div>
    </main>
  </div>

  <script>
    /* ================= FIREBASE INITIALIZATION ================= */
    const firebaseConfig = {
      apiKey: "AIzaSyAYvNTQGUufhD12qr1rAgwgjteaxzvw21o",
      authDomain: "trackie-eec82.firebaseapp.com",
      projectId: "trackie-eec82",
      storageBucket: "trackie-eec82.firebasestorage.app",
      messagingSenderId: "1079821550818",
      appId: "1:1079821550818:web:d190f92bdbc11aea0d0abb",
      measurementId: "G-GKHZQGSEPP"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    /* ================= STUDENT ROSTER STATE ================= */
    let currentBatch = 'Batch A - CS';
    const students = [
      { id: 1, name: "Aarav Sharma", roll: "01", status: "present" },
      { id: 2, name: "Isha Patel", roll: "02", status: "present" },
      { id: 3, name: "Rohan Verma", roll: "03", status: "present" },
      { id: 4, name: "Sneha Nair", roll: "04", status: "present" },
    ];

    function renderStudents() {
      const container = document.getElementById('studentList');
      container.innerHTML = '';
      let presentCount = 0;

      students.forEach((s, idx) => {
        if (s.status === 'present') presentCount++;
        const card = document.createElement('div');
        card.className = `student-card ${s.status}`;
        card.onclick = () => toggleAttendance(idx);
        card.innerHTML = `
          <div class="student-info">
            <span class="roll-pill">#${s.roll}</span>
            <span class="student-name">${s.name}</span>
          </div>
          <div class="status-indicator">${s.status}</div>
        `;
        container.appendChild(card);
      });

      document.getElementById('statsCounter').textContent = 
        `Present: ${presentCount} | Absent: ${students.length - presentCount}`;
    }

    function toggleAttendance(index) {
      students[index].status = students[index].status === 'present' ? 'absent' : 'present';
      renderStudents();
    }

    function switchBatch(el, batchName) {
      document.querySelectorAll('.class-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      currentBatch = batchName;
    }

    /* Save Session to Cloud Firestore */
    document.getElementById('btnSaveAttendance').addEventListener('click', () => {
      const user = auth.currentUser;
      if (!user) return;

      const record = {
        faculty: user.phoneNumber,
        batch: currentBatch,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        records: students
      };

      db.collection('attendance_logs').add(record).then(() => {
        alert("Attendance recorded to Apex Cloud.");
      }).catch(err => alert("Sync error: " + err.message));
    });

    /* ================= AUTHENTICATION FLOW ================= */
    let confirmationResult = null;
    const authStatus = document.getElementById('authStatus');

    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptchaContainer', { size: 'invisible' });

    document.getElementById('btnSendOtp').addEventListener('click', () => {
      const num = document.getElementById('phoneNumber').value.trim();
      if (num.length < 10) return alert("Enter valid 10-digit number");

      authStatus.textContent = "Requesting code...";
      authStatus.style.color = "var(--primary)";

      auth.signInWithPhoneNumber("+91" + num, window.recaptchaVerifier)
        .then(result => {
          confirmationResult = result;
          document.getElementById('phoneStep').classList.add('hidden');
          document.getElementById('otpStep').classList.remove('hidden');
          authStatus.textContent = "Code sent!";
        })
        .catch(err => {
          authStatus.textContent = err.message;
          authStatus.style.color = "var(--danger)";
        });
    });

    document.getElementById('btnVerifyOtp').addEventListener('click', () => {
      const code = document.getElementById('otpCode').value.trim();
      authStatus.textContent = "Verifying...";

      confirmationResult.confirm(code)
        .then(() => authStatus.textContent = "")
        .catch(err => {
          authStatus.textContent = "Invalid code. Please retry.";
          authStatus.style.color = "var(--danger)";
        });
    });

    document.getElementById('btnResetPhone').addEventListener('click', () => {
      document.getElementById('otpStep').classList.add('hidden');
      document.getElementById('phoneStep').classList.remove('hidden');
      authStatus.textContent = "";
    });

    document.getElementById('btnSignOut').addEventListener('click', () => auth.signOut());

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('appView').classList.remove('hidden');
        renderStudents();
      } else {
        document.getElementById('appView').classList.add('hidden');
        document.getElementById('authView').classList.remove('hidden');
        document.getElementById('phoneStep').classList.remove('hidden');
        document.getElementById('otpStep').classList.add('hidden');
      }
    });

    /* Service Worker */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/Trackie/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
