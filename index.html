<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trackie</title>
  <link rel="manifest" href="/Trackie/manifest.json" />
  <meta name="theme-color" content="#090d16" />
  <link rel="apple-touch-icon" href="/Trackie/icon-512.png" />

  <!-- Firebase Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --surface: rgba(18, 24, 38, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --primary-hover: #0ea5e9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --input-bg: #0f172a;
      --danger: #f43f5e;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #172554, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .phone-input-wrap {
      display: flex;
      gap: 0.5rem;
    }

    .prefix-box {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #ffffff;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #041427;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 12px;
      padding: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      margin-top: 0.25rem;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-weight: 500;
    }

    button.secondary:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .badge {
      display: inline-block;
      align-self: center;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .status-msg {
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.25rem;
      margin-top: -0.25rem;
    }

    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--success); }

    .hidden { display: none !important; }

    /* Dashboard view */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .user-info {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .user-phone {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- AUTHENTICATION CARD -->
    <div id="authCard" class="card">
      <div class="header">
        <span class="badge">Apex Academic Cloud</span>
        <h1 style="margin-top: 0.5rem;">Trackie</h1>
        <p>Sign in via secure phone verification</p>
      </div>

      <div class="form-group">
        <label for="instId">Workspace / Institute ID</label>
        <input type="text" id="instId" value="inst_apex" autocomplete="off" />
      </div>

      <!-- Phone entry step -->
      <div id="phoneStep" class="form-group" style="gap: 1rem;">
        <div>
          <label for="phoneNumber">Mobile Number (10 Digits)</label>
          <div class="phone-input-wrap" style="margin-top: 0.45rem;">
            <div class="prefix-box">+91</div>
            <input type="tel" id="phoneNumber" placeholder="9876543210" maxlength="10" inputmode="numeric" />
          </div>
        </div>
        <button id="btnSendOtp" type="button">Send OTP</button>
      </div>

      <!-- OTP entry step (initially hidden) -->
      <div id="otpStep" class="form-group hidden" style="gap: 1rem;">
        <div>
          <label for="otpCode">6-Digit SMS Verification Code</label>
          <input type="number" id="otpCode" placeholder="123456" maxlength="6" inputmode="numeric" style="margin-top: 0.45rem;" />
        </div>
        <button id="btnVerifyOtp" type="button">Verify & Launch</button>
        <button id="btnReset" type="button" class="secondary">Change Phone Number</button>
      </div>

      <div id="recaptchaContainer"></div>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- MAIN APP DASHBOARD (Hidden until logged in) -->
    <div id="dashboardCard" class="card hidden">
      <div class="dashboard-header">
        <div>
          <div class="user-info">Logged In Workspace</div>
          <div id="displayUserPhone" class="user-phone">+91 0000000000</div>
        </div>
        <button id="btnSignOut" type="button" class="secondary" style="width: auto; padding: 0.4rem 0.85rem; font-size: 0.8rem; margin: 0;">Sign Out</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-num">Active</div>
          <div class="stat-label">System Status</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="recordCount">0</div>
          <div class="stat-label">Sync Records</div>
        </div>
      </div>

      <div class="form-group" style="margin-top: 0.5rem;">
        <button id="btnMarkAttendance" type="button">Record Test Entry</button>
      </div>
    </div>
  </div>

  <script>
    /* ================= FIREBASE CONFIGURATION ================= */
    const firebaseConfig = {
      apiKey: "AIzaSyAYvNTQGUufhD12qr1rAgwgjteaxzvw21o",
      authDomain: "trackie-eec82.firebaseapp.com",
      projectId: "trackie-eec82",
      storageBucket: "trackie-eec82.firebasestorage.app",
      messagingSenderId: "1079821550818",
      appId: "1:1079821550818:web:d190f92bdbc11aea0d0abb",
      measurementId: "G-GKHZQGSEPP"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    /* ================= DOM ELEMENTS ================= */
    const authCard = document.getElementById('authCard');
    const dashboardCard = document.getElementById('dashboardCard');
    const phoneStep = document.getElementById('phoneStep');
    const otpStep = document.getElementById('otpStep');
    const statusMsg = document.getElementById('statusMsg');
    const phoneNumberInput = document.getElementById('phoneNumber');
    const otpCodeInput = document.getElementById('otpCode');
    const btnSendOtp = document.getElementById('btnSendOtp');
    const btnVerifyOtp = document.getElementById('btnVerifyOtp');
    const btnReset = document.getElementById('btnReset');
    const btnSignOut = document.getElementById('btnSignOut');
    const displayUserPhone = document.getElementById('displayUserPhone');
    const btnMarkAttendance = document.getElementById('btnMarkAttendance');
    const recordCountDisplay = document.getElementById('recordCount');

    let confirmationResult = null;

    function setStatus(text, type = 'normal') {
      statusMsg.textContent = text;
      statusMsg.className = 'status-msg ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
    }

    /* Invisible reCAPTCHA */
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptchaContainer', {
      size: 'invisible'
    });

    /* Send OTP */
    btnSendOtp.addEventListener('click', () => {
      const rawNumber = phoneNumberInput.value.trim();
      if (rawNumber.length < 10) {
        setStatus("Please enter a valid 10-digit phone number.", "error");
        return;
      }

      const formattedNumber = "+91" + rawNumber;
      btnSendOtp.disabled = true;
      setStatus("Sending verification code...");

      auth.signInWithPhoneNumber(formattedNumber, window.recaptchaVerifier)
        .then((result) => {
          confirmationResult = result;
          phoneStep.classList.add('hidden');
          otpStep.classList.remove('hidden');
          setStatus("Code sent successfully!", "success");
        })
        .catch((error) => {
          console.error(error);
          setStatus(error.message, "error");
          btnSendOtp.disabled = false;
        });
    });

    /* Verify OTP */
    btnVerifyOtp.addEventListener('click', () => {
      const code = otpCodeInput.value.trim();
      if (code.length < 6) {
        setStatus("Please enter the 6-digit code.", "error");
        return;
      }

      btnVerifyOtp.disabled = true;
      setStatus("Verifying code...");

      confirmationResult.confirm(code)
        .then((userCredential) => {
          setStatus("Authorized!", "success");
        })
        .catch((error) => {
          console.error(error);
          setStatus("Invalid code. Please retry.", "error");
          btnVerifyOtp.disabled = false;
        });
    });

    /* Reset to enter phone again */
    btnReset.addEventListener('click', () => {
      otpStep.classList.add('hidden');
      phoneStep.classList.remove('hidden');
      btnSendOtp.disabled = false;
      btnVerifyOtp.disabled = false;
      otpCodeInput.value = '';
      setStatus("");
    });

    /* Sign out */
    btnSignOut.addEventListener('click', () => {
      auth.signOut();
    });

    /* Attendance test trigger */
    btnMarkAttendance.addEventListener('click', () => {
      const currentUser = auth.currentUser;
      if (!currentUser) return;

      db.collection('attendance_test').add({
        phone: currentUser.phoneNumber,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        setStatus("Activity synced to Firestore!", "success");
      });
    });

    /* Auth state listener */
    auth.onAuthStateChanged((user) => {
      if (user) {
        authCard.classList.add('hidden');
        dashboardCard.classList.remove('hidden');
        displayUserPhone.textContent = user.phoneNumber;

        // Listen to test updates in real-time
        db.collection('attendance_test')
          .where('phone', '==', user.phoneNumber)
          .onSnapshot((snap) => {
            recordCountDisplay.textContent = snap.size;
          });
      } else {
        dashboardCard.classList.add('hidden');
        authCard.classList.remove('hidden');
        phoneStep.classList.remove('hidden');
        otpStep.classList.add('hidden');
        btnSendOtp.disabled = false;
        btnVerifyOtp.disabled = false;
        otpCodeInput.value = '';
        setStatus("");
      }
    });

    /* Register Service Worker for PWA */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/Trackie/sw.js')
          .then(reg => console.log('ServiceWorker registered:', reg.scope))
          .catch(err => console.log('ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
</html>
